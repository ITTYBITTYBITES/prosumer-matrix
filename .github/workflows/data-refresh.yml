# ============================================================================
# GitHub Actions Workflow: Data Refresh Validation
# ============================================================================

name: Data Schema Validation

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'src/data/hardware.json'
      - 'src/data/HardwareSchema.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Hardware Schema
        id: schema_validation
        run: npx ajv test -s src/data/HardwareSchema.json -d src/data/hardware.json --valid

      - name: Report Results
        if: always()
        run: |
          echo "## Schema Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Schema validation ${{ steps.schema_validation.outcome == 'success' && 'passed' || 'failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data File**: src/data/hardware.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Schema**: src/data/HardwareSchema.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
