<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Cache-busting: Prevent browser from caching this HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>Prosumer Matrix | Hardware & Equipment Spec Database</title>
  <meta name="description" content="Comprehensive database of prosumer hardware specifications including 3D printers, CNC laser cutters, solar power systems, drones, espresso machines, and utility EVs.">
  <meta name="theme-color" content="#0F172A">
  
  <!-- Impact Site Verification -->
  <meta name="impact-site-verification" value="e1775b7e-fc95-4f9e-bdee-dd2b4e0117e2">
  
  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="piDEDZ_6HFe7SUQInL9djeSprzAewi0UxW_IWN5Wn6Q" />

  <!-- Favicon. BASE_URL is replaced by Vite for the GitHub Pages subpath. -->
  <link rel="icon" type="image/svg+xml" href="/prosumer-matrix/favicon.svg">

  <!-- Preconnect for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!--
    Install the startup failure handler before Vite's module entry is fetched.
    This also catches a failed entry-script request (for example, a stale cache
    pointing at an old hashed file) that cannot be caught inside app.js.
  -->
  <script>
    window.showStartupError = function () {
      const container = document.getElementById('matrixContainer');
      const loadingState = document.getElementById('loadingState');

      // A failed module can report before the parser has reached the body.
      // Retry once the loading elements exist rather than leaving them visible.
      if (!container || !loadingState) {
        document.addEventListener('DOMContentLoaded', window.showStartupError, { once: true });
        return;
      }

      if (container) {
        container.innerHTML = `
          <div class="error-state">
            <h2>Unable to start Prosumer Matrix</h2>
            <p>The application files could not be loaded. Please refresh the page.</p>
          </div>
        `;
      }

      if (loadingState) {
        loadingState.classList.add('loaded');
      }
    };

    window.addEventListener('error', function (event) {
      const failedElement = event.target;
      if (failedElement && failedElement.tagName === 'SCRIPT' && failedElement.type === 'module') {
        window.showStartupError();
      }
    }, true);
  </script>

  <!-- Vite will inject processed CSS and JS with hashed filenames -->
  <script type="module" crossorigin src="/prosumer-matrix/assets/main-CEY9Na8g.js"></script>
</head>
<body>
  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Main Application Container -->
  <div id="matrixContainer"></div>

  <!-- Loading State -->
  <div id="loadingState" class="loading-state" aria-live="polite">
    <div class="loading-spinner">
      <svg viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="20" fill="none" stroke="#1E293B" stroke-width="4"/>
        <path d="M25 5a20 20 0 0140 0" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="loading-text">Loading Prosumer Matrix...</p>
  </div>

  <!--
    Keep the loader from becoming a permanent screen if app.js or one of its
    imports cannot be fetched. Vite rewrites this import to the GitHub Pages
    asset path during the production build.
  -->

  <!-- Inline critical CSS for initial render -->
  <style>
    /* Critical CSS for initial paint */
    .loading-state {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      color: #94A3B8;
      font-family: 'Inter', system-ui, sans-serif;
      z-index: 9999;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      animation: spin 1s linear infinite;
    }
    .loading-spinner svg {
      width: 100%;
      height: 100%;
    }
    .loading-text {
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    :root {
      --bg-primary: #0F172A;
      --bg-surface: #1E293B;
      --bg-elevated: #334155;
      --border-color: #334155;
      --accent-sky: #0EA5E9;
      --accent-emerald: #10B981;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --error: #EF4444;
      --warning: #F59E0B;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--accent-sky);
      color: var(--bg-primary);
    }

    :focus-visible {
      outline: 2px solid var(--accent-sky);
      outline-offset: 2px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    a {
      color: var(--accent-sky);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip-link:focus {
      left: 16px;
      top: 16px;
      width: auto;
      height: auto;
      padding: 8px 16px;
      background: var(--accent-sky);
      color: var(--bg-primary);
      border-radius: 4px;
      z-index: 10000;
    }

    .error-state {
      padding: 48px 24px;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .error-state h2 {
      color: var(--error);
      margin-bottom: 16px;
    }

    .error-state pre {
      background: var(--bg-surface);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: left;
      margin-top: 16px;
    }

    /* Loading state hidden when app renders */
    .loading-state.loaded {
      display: none;
    }
  </style>
</body>
</html>
